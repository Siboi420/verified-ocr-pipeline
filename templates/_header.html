{# Shared top bar: browser-style tabs, model dropdown + status chip, and
   a toast container. Included by index.html and chat.html. The dropdown
   lists the models installed in Unsloth Studio (GET /api/model). #}
<style>
  .topbar { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs { display: flex; gap: 4px; }
  .tabs a { text-decoration: none; padding: 6px 16px; border: 1px solid var(--line, #ccc);
            border-bottom: none; border-radius: 6px 6px 0 0; background: #fff; color: #222;
            font-size: 14px; }
  .tabs a.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  #modelBar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-left: auto; padding-bottom: 2px; }
  #modelBar .muted { font-size: 12px; }
  #modelChip { font-size: 12px; background: #eef2ff; border: 1px solid var(--line, #ccc);
               border-radius: 10px; padding: 2px 10px; max-width: 340px; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
  #modelChip.loaded { background: #ecfdf5; color: #065f46; }
  #modelSel { font-size: 12px; max-width: 280px; }
  #modelBar button { font-size: 12px; padding: 3px 10px; }
  #modelBar button:disabled, #modelSel:disabled { opacity: .5; cursor: default; }
  #toasts { position: fixed; top: 10px; right: 10px; z-index: 99; display: flex;
            flex-direction: column; gap: 6px; max-width: 420px; }
  .toast { background: #111827; color: #fff; padding: 8px 12px; border-radius: 6px;
           font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.25); white-space: pre-wrap; }
  .toast.error { background: #991b1b; }
  .toast.done { background: #065f46; }
</style>

<div class="topbar">
  <nav class="tabs">
    <a href="/" class="{{ 'active' if tab is defined and tab == 'ocr' else '' }}">OCR Validation</a>
    <a href="/chat" class="{{ 'active' if tab is defined and tab == 'chat' else '' }}">Chat</a>
  </nav>
  <div id="modelBar">
    <span class="muted">Model:</span>
    <span id="modelChip">…</span>
    <select id="modelSel" title="models installed in Unsloth Studio"></select>
    <button id="loadBtn" onclick="loadModel()">Load</button>
  </div>
</div>
<div id="toasts"></div>

<script>
// ---- shared widgets: model bar + toasts + KB fetch (both pages use these) ----
let progressToast = null;
function toast(msg, cls) {
  const t = document.createElement('div');
  t.className = 'toast' + (cls ? ' ' + cls : '');
  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 6000);
}
function progress(msg) {
  if (!progressToast) {
    progressToast = document.createElement('div');
    progressToast.className = 'toast';
    document.getElementById('toasts').appendChild(progressToast);
  }
  progressToast.textContent = msg;
}
function clearProgress() {
  if (progressToast) { progressToast.remove(); progressToast = null; }
}
function setModelBusy(b) {
  document.getElementById('modelSel').disabled = b;
  document.getElementById('loadBtn').disabled = b;
}
// Select the loaded model in the dropdown. The loaded path may be a
// resolved local snapshot, so match by GGUF filename suffix; when it's
// absent from the list, append it as an option so it stays visible.
function fillModelSel(available, loaded) {
  const sel = document.getElementById('modelSel');
  sel.innerHTML = '';
  let match = null;
  for (const m of (available || [])) {
    if (!m || !m.path) continue;
    const o = document.createElement('option');
    o.value = m.path;
    o.textContent = m.name || m.path;
    sel.appendChild(o);
    if (loaded && (m.path === loaded || (m.path.split('/').pop() && loaded.includes(m.path.split('/').pop()))))
      match = o;
  }
  if (loaded && !match) {
    const o = document.createElement('option');
    o.value = loaded;
    o.textContent = loaded;
    sel.appendChild(o);
    match = o;
  }
  if (match) sel.value = match.value;
  else if (sel.options.length) sel.value = sel.options[0].value;
}
async function pollModelJob(jobId) {
  setModelBusy(true);
  for (;;) {
    let st = {};
    try { st = await (await fetch('/jobs/' + jobId)).json(); } catch (e) { /* keep polling; a hiccup is not fatal */ }
    if (st.status === 'running') {
      progress(st.step || '…');
    } else {
      setModelBusy(false);
      if (st.status === 'done') { clearProgress(); toast(st.step || 'loaded', 'done'); }
      else { clearProgress(); toast('✗ ' + (st.error || st.status || 'job lost (app restarted?)'), 'error'); }
      modelState();  // refresh the chip now that the job is over
      break;
    }
    await new Promise(res => setTimeout(res, 1500));
  }
}
async function modelState() {
  try {
    const r = await fetch('/api/model');
    const j = await r.json();
    const chip = document.getElementById('modelChip');
    chip.textContent = j.loaded ? j.loaded : 'none loaded';
    chip.classList.toggle('loaded', !!j.loaded);
    fillModelSel(j.available, j.loaded);
    if (j.job && j.job.status === 'running') {
      progress(j.job.step || '…');
      pollModelJob(j.job.id);  // re-attach progress after a tab switch / reload
    }
  } catch (e) { /* backend down: leave the chip as-is */ }
}
async function loadModel() {
  const sel = document.getElementById('modelSel');
  if (sel.disabled) return;
  const path = sel.value;
  if (!path) return;
  setModelBusy(true);
  try {
    const r = await fetch('/api/model/load', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({model:path})});
    const j = await r.json();
    if (j.status === 'done') {
      toast(j.step === 'already loaded' ? 'already loaded' : j.step, 'done');
      modelState();
    } else if (j.error) {
      toast('error: ' + j.error, 'error');
    } else if (j.job_id) {
      await pollModelJob(j.job_id);
    }
  } catch (e) {
    clearProgress();
    toast('error: ' + e, 'error');
  } finally {
    setModelBusy(false);
  }
}
// KB fetch helper: returns {ok, knowledgeBases} or {ok:false}
window.kbFetch = async function() {
  try {
    const r = await fetch('/api/kb');
    const j = await r.json();
    j.ok = r.ok;  // api/kb response has no ok field
    return j;
  } catch (e) { return {ok:false, knowledgeBases:[]}; }
};
modelState();  // chip on page load
</script>
